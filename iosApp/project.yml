name: iosApp
options:
  bundleIdPrefix: io.github.yarn44.kmp.showcase
  deploymentTarget:
    iOS: "18.6"

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug

packages:
  ShowcaseKit:
    path: ../shared

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        INFOPLIST_FILE: iosApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yarn44.kmp.showcase.ios
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: "YES"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: ShowcaseKit
      - sdk: libsqlite3.tbd
    preBuildScripts:
      - name: "Compile Kotlin Framework"
        script: |
          # Skip in CI: the XCFramework is expected to be built and cached separately
          if [ -n "$CI" ] || [ -n "$GITHUB_ACTIONS" ]; then
              echo "Skipping KMP build in CI environment"
              exit 0
          fi
          # Xcode build phase scripts do not inherit JAVA_HOME from the user's
          # shell. Pin JDK 21 explicitly so the Kotlin Gradle Plugin does not
          # fall back to the system default JDK (e.g. JDK 25 on macOS Tahoe).
          export JAVA_HOME=$(/usr/libexec/java_home -v 21)
          # `-Papp.ios.shared.arch=arm64` drops iosX64 (Intel-Mac simulator)
          # to speed up day-to-day dev builds. Drop the flag for full
          # release / CI to also produce iosX64.
          cd "$SRCROOT/.." && ./gradlew :shared:assembleShowcaseKitDebugXCFramework -Papp.ios.shared.arch=arm64
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - path: ../script/sync-compose-resources.sh
        name: "Sync Compose Resources"
        basedOnDependencyAnalysis: false
