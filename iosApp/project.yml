name: iosApp
options:
  bundleIdPrefix: io.github.mitsuharu.showcase
  deploymentTarget:
    iOS: "17.0"

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
    settings:
      base:
        INFOPLIST_FILE: iosApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mitsuharu.showcase.ios
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: "YES"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: "NO"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
          - "$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"
          - "$(SRCROOT)/../shared/build/bin/iosX64/debugFramework"
      configs:
        Debug:
          FRAMEWORK_SEARCH_PATHS:
            - "$(inherited)"
            - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
            - "$(SRCROOT)/../shared/build/bin/iosX64/debugFramework"
        Release:
          FRAMEWORK_SEARCH_PATHS:
            - "$(inherited)"
            - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/releaseFramework"
            - "$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"
            - "$(SRCROOT)/../shared/build/bin/iosX64/releaseFramework"
    dependencies:
      - framework: ../shared/build/bin/iosSimulatorArm64/debugFramework/ShowcaseKit.framework
        embed: false
      - sdk: libsqlite3.tbd
