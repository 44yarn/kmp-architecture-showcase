disabled_rules:
  - trailing_whitespace
  - unused_optional_binding

opt_in_rules:
  - empty_count
  - closure_end_indentation
  - closure_spacing
  - contains_over_first_not_nil
  - discouraged_object_literal
  - empty_string

line_length:
  warning: 120
  error: 150
  ignores_comments: true

file_length:
  warning: 500
  error: 1000

type_body_length:
  warning: 300
  error: 500

identifier_name:
  min_length: 2
  max_length: 40
  excluded:
    - id
    - x
    - y
